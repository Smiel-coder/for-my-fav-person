
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Vợ yêu 💖</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ed, #ffc2dc, #fff0f6);
      color: #87365b;
    }
    .card {
      width: min(90%, 430px);
      padding: 35px 22px;
      text-align: center;
      background: rgba(255,255,255,.88);
      border: 2px solid #fff;
      border-radius: 28px;
      box-shadow: 0 12px 40px #d76c9b35;
    }
    .heart { font-size: 58px; animation: pulse 1.2s infinite; }
    h1 { font-size: 2.1rem; margin: 15px 0; }
    p { font-size: 1.05rem; }
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 28px;
      min-height: 60px;
    }
    button {
      border: none;
      padding: 14px 20px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform .2s;
    }
    button:active { transform: scale(.95); }
    #yes {
      background: #ed5d9c;
      color: white;
      box-shadow: 0 5px 12px #ed5d9c45;
    }
    #no { background: #ffe0ed; color: #a83b70; }
    .hint { font-size: .85rem; color: #b36a8c; margin-top: 22px; }
    @keyframes pulse {
      50% { transform: scale(1.12); }
    }
    .floating {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
    }
    @keyframes floatUp {
      to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💋</div>
    <h1>I want kiss🥺💋</h1>
    <p>🥺🥺🥺🥺🥺</p>
    <div class="buttons">
      <button id="yes" onclick="goToSurprise()">Kiss 💋</button>
      <button id="no" onclick="moveNo()">I dun like 😋</button>
    </div>
    <p class="hint">Choose wisely cutie Nih 😈</p>
  </main>

  <script>
    function goToSurprise() {
      window.location.href = "surprise.html";
    }

    function moveNo() {
      const btn = document.getElementById("no");
      btn.style.position = "fixed";
      const maxX = Math.max(0, window.innerWidth - btn.offsetWidth - 10);
      const maxY = Math.max(0, window.innerHeight - btn.offsetHeight - 10);
      btn.style.left = Math.random() * maxX + "px";
      btn.style.top = Math.random() * maxY + "px";
    }

    setInterval(() => {
      const heart = document.createElement("span");
      heart.className = "floating";
      heart.textContent = ["💗", "💕", "💖", "💋"][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (18 + Math.random() * 18) + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 800);
  </script>
</body>
</html>
