
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Vợ yêu 💖</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 14px 45px;
      font-family: Arial, sans-serif;
      color: #87365b;
      background: linear-gradient(135deg, #ffe0ed, #ffc2dc, #fff0f6);
      min-height: 100vh;
    }

    .container { max-width: 520px; margin: auto; }

    .card {
      background: rgba(255,255,255,.9);
      border: 2px solid white;
      border-radius: 25px;
      padding: 25px 20px;
      margin: 18px 0;
      text-align: center;
      box-shadow: 0 10px 30px #d76c9b25;
    }

    h1 { font-size: 2rem; }
    h2 { margin-top: 8px; }

    button {
      border: 0;
      border-radius: 25px;
      padding: 13px 18px;
      margin: 7px 4px;
      background: #ed5d9c;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:active { transform: scale(.97); }

    .cat {
      font-size: 75px;
      cursor: pointer;
      user-select: none;
    }

    .caption { color: #b36a8c; font-size: .9rem; }

    .back {
      display: inline-block;
      margin: 5px 0 10px;
      color: #a83b70;
      text-decoration: none;
      font-weight: bold;
    }

    /* Small music button at the top right */
    .music-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      width: 38px;
      height: 38px;
      padding: 0;
      margin: 0;
      border: 2px solid white;
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      color: #e84393;
      font-size: 18px;
      box-shadow: 0 3px 12px #d76c9b40;
    }
  </style>
</head>
<body>

  <!-- Background music -->
  <audio id="backgroundMusic" src="Love.mp3"
         loop autoplay preload="auto"></audio>

  <!-- Music ON/OFF button -->
  <button id="musicButton" class="music-toggle"
          onclick="toggleMusic()" aria-label="Turn music off">♫</button>

  <main class="container">
    <a class="back" href="index.html">← spam kissee meee💋</a>

    <section class="card">
      <h1>For My Vợ yêu 💖</h1>
    </section>

    <section class="card">
      <h2>A little kitty kitty 😭</h2>
      <div class="cat" onclick="playVoice('meowAudio')">🐱</div>
      <p>try to tap babe and you will hear Viva😭</p>
      <button onclick="playVoice('meowAudio')">Meow for meow 🐾</button>
      <audio id="meowAudio" src="meow.m4a" preload="auto"></audio>
      <p class="caption">--------------------</p>
    </section>

    <section class="card">
      <h2>Monthsary 💖</h2>
      <p>A message for my wifey Nih 💖</p>
      <button onclick="playVoice('monthsaryAudio')">Monthsary 💖</button>
      <audio id="monthsaryAudio" src="month.m4a" preload="auto"></audio>
      <p class="caption">--------------------</p>
    </section>

    <section class="card">
      <h2>For Wifey Nih 💋</h2>
      <p>Press it babeeeee 🥹</p>
      <button onclick="playVoice('wifeyAudio')">For Wifey Nih 💖</button>
      <audio id="wifeyAudio" src="wifeyy.m4a" preload="auto"></audio>
      <p class="caption">--------------------</p>
    </section>
  </main>

  <script>
    const backgroundMusic = document.getElementById("backgroundMusic");
    const musicButton = document.getElementById("musicButton");

    // Soft background music volume: 20%
    backgroundMusic.volume = 0.20;

    let musicOff = false;

    // Try autoplay when the page opens
    backgroundMusic.play().catch(() => {
      // Browser may require the visitor to tap first
    });

    // Start music after the first interaction if autoplay was blocked
    document.addEventListener("click", function startMusic() {
      if (!musicOff && backgroundMusic.paused) {
        backgroundMusic.play().catch(() => {});
      }
    });

    function toggleMusic() {
      if (musicOff) {
        musicOff = false;
        backgroundMusic.play().then(() => {
          musicButton.textContent = "♫";
          musicButton.setAttribute("aria-label", "Turn music off");
        }).catch(() => {
          musicOff = true;
        });
      } else {
        musicOff = true;
        backgroundMusic.pause();
        musicButton.textContent = "♪";
        musicButton.setAttribute("aria-label", "Turn music on");
      }
    }

    function playVoice(id) {
      const selected = document.getElementById(id);

      // Stop other voice recordings, but keep background music playing
      document.querySelectorAll("audio").forEach(audio => {
        if (audio !== selected && audio !== backgroundMusic) {
          audio.pause();
          audio.currentTime = 0;
        }
      });

      selected.currentTime = 0;
      selected.play().catch(() => {
        alert("Check that the recording exists and its filename matches the code.");
      });
    }
  </script>
</body>
</html>
